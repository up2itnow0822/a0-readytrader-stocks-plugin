name: readytrader_stocks
title: ReadyTrader Stocks (paper)
description: Paper stock trading for Agent Zero through the ReadyTrader-Stocks MCP server. Installing the plugin installs the server into the plugin folder, registers it as an MCP server and adds a paper-trading skill. It never enables live trading and uses no broker keys.
version: 2.0.0
settings_sections:
  - external
per_project_config: false
per_agent_config: false
always_enabled: false
